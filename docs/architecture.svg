<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Helvetica,Arial,sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<style>.b{fill:#fff;stroke:#333;stroke-width:1.5}.m{fill:#e8f0fe;stroke:#3b6fd4;stroke-width:1.5}.t{fill:#e9f7ec;stroke:#2e8b57;stroke-width:1.5}.g{fill:#fff4e5;stroke:#d9822b;stroke-width:1.5}.f{fill:#fdecea;stroke:#c0392b;stroke-width:1.5;stroke-dasharray:5 3}.l{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a)}.h{font-weight:bold;font-size:14}.s{font-size:11.5px;fill:#444}</style>
<text x="490" y="26" text-anchor="middle" class="h" font-size="18">Repo-Review Agent: architecture &amp; control flow</text>
<rect class="b" x="20" y="60" width="160" height="56" rx="8"/><text x="100" y="84" text-anchor="middle" class="h">User goal (CLI)</text><text x="100" y="102" text-anchor="middle" class="s">python -m agent "&lt;goal&gt;"</text>
<rect class="m" x="260" y="50" width="300" height="76" rx="8"/><text x="410" y="74" text-anchor="middle" class="h">LLM (Anthropic / OpenAI-compatible)</text><text x="410" y="94" text-anchor="middle" class="s">plans, picks next tool, diagnoses failures,</text><text x="410" y="110" text-anchor="middle" class="s">revises plan, writes the report</text>
<rect class="b" x="640" y="50" width="300" height="76" rx="8"/><text x="790" y="74" text-anchor="middle" class="h">Agent loop (agent/loop.py)</text><text x="790" y="94" text-anchor="middle" class="s">turn budget, plan-first gate, loop guard,</text><text x="790" y="110" text-anchor="middle" class="s">nudges, report validation, tracing</text>
<path class="l" d="M180 88H258"/><path class="l" d="M562 80H638"/><path class="l" d="M640 104H562"/>
<text x="600" y="72" text-anchor="middle" class="s">messages + tool specs</text><text x="600" y="120" text-anchor="middle" class="s">tool calls</text>
<rect class="g" x="40" y="190" width="250" height="110" rx="8"/><text x="165" y="212" text-anchor="middle" class="h">Meta tools (control)</text><text x="165" y="234" text-anchor="middle" class="s">make_plan  - visible plan / revisions</text><text x="165" y="252" text-anchor="middle" class="s">ask_user   - ambiguous goal, ends run</text><text x="165" y="270" text-anchor="middle" class="s">submit_report - validated schema</text><text x="165" y="288" text-anchor="middle" class="s">(rejected + retried if invalid)</text>
<rect class="t" x="350" y="190" width="330" height="170" rx="8"/><text x="515" y="212" text-anchor="middle" class="h">Tool registry (agent/tools)</text><text x="515" y="234" text-anchor="middle" class="s">repo_info  repo_search  repo_list_files</text><text x="515" y="252" text-anchor="middle" class="s">repo_read_file  repo_grep</text><text x="515" y="270" text-anchor="middle" class="s">analyze_python_file (AST)  calculator</text><text x="515" y="296" text-anchor="middle" class="s">JSON-schema input check - timeout -</text><text x="515" y="312" text-anchor="middle" class="s">output-shape check - typed ToolError</text><text x="515" y="338" text-anchor="middle" class="s">auto-retry + backoff: transient / 429 / malformed</text>
<rect class="b" x="740" y="190" width="200" height="110" rx="8"/><text x="840" y="212" text-anchor="middle" class="h">Live data</text><text x="840" y="236" text-anchor="middle" class="s">git shallow clone of the repo</text><text x="840" y="254" text-anchor="middle" class="s">GitHub search API</text><text x="840" y="272" text-anchor="middle" class="s">(nothing bundled)</text>
<rect class="f" x="350" y="400" width="330" height="60" rx="8"/><text x="515" y="424" text-anchor="middle" class="h">Fault injector (--inject-fault)</text><text x="515" y="442" text-anchor="middle" class="s">timeout / 429 / malformed / 404 on any tool</text>
<path class="l" d="M790 128V160H165V188"/><path class="l" d="M790 160H515V188"/><path class="l" d="M682 280H738"/><path class="l" d="M515 398V362"/>
<text x="650" y="176" class="s">dispatch</text>
<text x="360" y="378" class="s">sabotages registry.call to prove recovery</text>
<rect class="b" x="40" y="500" width="900" height="84" rx="8"/><text x="490" y="524" text-anchor="middle" class="h">Outputs (--out runs/latest)</text><text x="490" y="546" text-anchor="middle" class="s">report.json (model-authored, schema-validated + run metadata) - report.md - trace.jsonl - transcript.txt</text><text x="490" y="566" text-anchor="middle" class="s">Error path: failures come back to the LLM as observations -&gt; it fixes arguments, uses another tool or revises the plan</text>
<path class="l" d="M790 128V180" style="display:none"/><path class="l" d="M165 302V498" style="display:none"/>
</svg>
