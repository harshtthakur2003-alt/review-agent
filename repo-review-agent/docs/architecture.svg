<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica,Arial,sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<style>.b{fill:#fff;stroke:#333;stroke-width:1.5}.t{fill:#e8f0fe;stroke:#3b6fd4;stroke-width:1.5}.r{fill:#fff4e5;stroke:#d9822b;stroke-width:1.5}.g{fill:#e9f7ec;stroke:#2e8b57;stroke-width:1.5}.f{fill:#fdecea;stroke:#c0392b;stroke-width:1.5;stroke-dasharray:5 3}.l{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a)}.h{font-weight:bold;font-size:14}.s{font-size:11.5px;fill:#444}</style>
<text x="480" y="26" text-anchor="middle" class="h" font-size="18">Repo-Review Agent: architecture &amp; control flow</text>

<rect class="b" x="30" y="55" width="170" height="55" rx="8"/><text x="115" y="78" text-anchor="middle" class="h">User goal (CLI)</text><text x="115" y="97" text-anchor="middle" class="s">natural-language text</text>
<path class="l" d="M200 82H250"/>
<rect class="g" x="250" y="50" width="210" height="75" rx="8"/><text x="355" y="73" text-anchor="middle" class="h">Planner</text><text x="355" y="91" text-anchor="middle" class="s">goal → steps + assumptions</text><text x="355" y="107" text-anchor="middle" class="s">validate plan; on invalid, re-ask once</text>
<rect class="b" x="520" y="50" width="200" height="75" rx="8"/><text x="620" y="73" text-anchor="middle" class="h">LLM backend (pluggable)</text><text x="620" y="91" text-anchor="middle" class="s">Anthropic Messages API  |  Offline</text><text x="620" y="107" text-anchor="middle" class="s">plan · repair · narrate</text>
<path class="l" d="M460 82H520"/><path class="l" d="M520 98H460" style="marker-end:url(#a)"/>
<text x="740" y="82" class="s">Ambiguous goal (no repo) → planner</text><text x="740" y="98" class="s">returns a Clarification request, no tools run</text>

<path class="l" d="M355 125V165"/><text x="365" y="150" class="s">validated Plan (visible trace)</text>
<rect class="g" x="150" y="165" width="410" height="95" rx="8"/><text x="355" y="187" text-anchor="middle" class="h">Executor  (step loop)</text>
<text x="355" y="206" text-anchor="middle" class="s">resolve $refs from earlier outputs · foreach fan-out per file</text>
<text x="355" y="222" text-anchor="middle" class="s">skip steps whose dependencies failed · partial results kept</text>
<text x="355" y="238" text-anchor="middle" class="s">bounded attempts (no infinite loops)</text>

<rect class="r" x="610" y="165" width="320" height="150" rx="8"/><text x="770" y="187" text-anchor="middle" class="h">Recovery ladder (per tool call)</text>
<text x="625" y="210" class="s">1. transient / rate-limit / malformed output →</text><text x="640" y="225" class="s">retry with exponential backoff</text>
<text x="625" y="245" class="s">2. not_found / invalid_input → tool-specific fallback</text><text x="640" y="260" class="s">(typo'd repo → fuzzy-match; wrong branch)</text>
<text x="625" y="280" class="s">3. else → LLM repair proposal (if backend supports it)</text>
<text x="625" y="300" class="s">4. else → mark step failed/partial, continue, report it</text>
<path class="l" d="M560 205H610"/><path class="l" d="M610 225H560"/>

<path class="l" d="M355 260V310"/>
<rect class="t" x="150" y="310" width="410" height="75" rx="8"/><text x="355" y="332" text-anchor="middle" class="h">Tool Registry</text>
<text x="355" y="350" text-anchor="middle" class="s">input check (required args) · hard timeout · output-schema check</text>
<text x="355" y="366" text-anchor="middle" class="s">errors typed: transient | rate_limited | not_found | invalid_*  | fatal</text>
<rect class="f" x="610" y="340" width="320" height="50" rx="8"/><text x="770" y="362" text-anchor="middle" class="h">Fault injector (--inject-fault)</text><text x="770" y="379" text-anchor="middle" class="s">wraps registry.call: timeout · 429 · malformed · 404</text>
<path class="l" d="M610 365H560"/>

<path class="l" d="M200 385V425"/><path class="l" d="M355 385V425"/><path class="l" d="M510 385V425"/>
<rect class="t" x="40" y="425" width="260" height="100" rx="8"/><text x="170" y="446" text-anchor="middle" class="h">Repo tools (live data)</text>
<text x="170" y="466" text-anchor="middle" class="s">repo_info  (git ls-remote)</text><text x="170" y="482" text-anchor="middle" class="s">repo_list_files / repo_read_file (shallow git clone)</text><text x="170" y="498" text-anchor="middle" class="s">repo_search (GitHub search API)</text>
<rect class="t" x="320" y="425" width="260" height="100" rx="8"/><text x="450" y="446" text-anchor="middle" class="h">Analysis tools</text>
<text x="450" y="466" text-anchor="middle" class="s">select_python_files · analyze_code (pure AST,</text><text x="450" y="482" text-anchor="middle" class="s">never executes code) · summarize_findings</text>
<rect class="t" x="600" y="425" width="170" height="100" rx="8"/><text x="685" y="446" text-anchor="middle" class="h">calculator</text><text x="685" y="466" text-anchor="middle" class="s">AST-whitelist evaluator</text><text x="685" y="482" text-anchor="middle" class="s">issue density → 0-100 score</text>

<rect class="b" x="790" y="425" width="140" height="100" rx="8"/><text x="860" y="446" text-anchor="middle" class="h">Tracer</text><text x="860" y="466" text-anchor="middle" class="s">live console</text><text x="860" y="482" text-anchor="middle" class="s">trace.jsonl</text><text x="860" y="498" text-anchor="middle" class="s">transcript.txt</text>

<path class="l" d="M450 525V565"/>
<rect class="g" x="250" y="565" width="400" height="55" rx="8"/><text x="450" y="587" text-anchor="middle" class="h">Reporter → report.json + report.md</text><text x="450" y="605" text-anchor="middle" class="s">status · score · findings · fixes · plan · per-step log · assumptions · limitations</text>
</svg>
